services:
  icecast:
    image: infiniteproject/icecast:latest
    ports:
      - "${ICECAST_PORT:-8000}:8000"
    volumes:
      # The image's own entrypoint.sh tries to sed-patch passwords/hostname/
      # limits into ITS OWN /etc/icecast.xml, then runs
      # `icecast -c /etc/icecast.xml` -- it never reads /etc/icecast2/, so a
      # config mounted there (the old path) is silently ignored no matter
      # what write_icecast_config() puts in it. Mount over the file the
      # entrypoint actually loads instead. No ICECAST_* env vars needed here
      # any more -- our file already has real values baked in directly by
      # write_icecast_config(), and entrypoint.sh's sed -i can't rewrite a
      # bind-mounted file anyway (fails with "Resource busy" on the rename);
      # leaving the env vars set would just make it try and fail on every
      # start for no benefit.
      - ./icecast/icecast.xml:/etc/icecast.xml
      - radio-data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      DATABASE_URL: sqlite:////data/radio.db
      DATA_DIR: /data
      AUDIOMUSE_URL: ${AUDIOMUSE_URL:-http://host.docker.internal:8387}
      AUDIOMUSE_API_TOKEN: ${AUDIOMUSE_API_TOKEN:-}
      NAVIDROME_URL: ${NAVIDROME_URL:-http://host.docker.internal:4533}
      NAVIDROME_USER: ${NAVIDROME_USER:-}
      NAVIDROME_PASSWORD: ${NAVIDROME_PASSWORD:-}
      ICECAST_HOST: icecast
      ICECAST_PORT: 8000
      ICECAST_PUBLIC_HOST: ${ICECAST_PUBLIC_HOST:-localhost}
      ICECAST_PUBLIC_PORT: ${ICECAST_PUBLIC_PORT:-8000}
      ICECAST_PUBLIC_SCHEME: ${ICECAST_PUBLIC_SCHEME:-}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:-hackme}
      LIQUIDSOAP_CALLBACK_SECRET: ${LIQUIDSOAP_CALLBACK_SECRET:-change-me}
      QUEUE_REFRESH_INTERVAL_SEC: ${QUEUE_REFRESH_INTERVAL_SEC:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-5000000}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-3}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RESTRICT_INTERNAL_ROUTES: ${RESTRICT_INTERNAL_ROUTES:-true}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      ICECAST_DOCKER_RESTART: ${ICECAST_DOCKER_RESTART:-true}
      DOCKER_COMPOSE_PROJECT: ${DOCKER_COMPOSE_PROJECT:-}
      KNOWLEDGE_FEATURE: ${KNOWLEDGE_FEATURE:-false}
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-sqlite:////data/knowledge.db}
      SEARXNG_URL: ${SEARXNG_URL:-}
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      KNOWLEDGE_LLM_PROVIDER: ${KNOWLEDGE_LLM_PROVIDER:-ollama}
      KNOWLEDGE_LLM_BASE_URL: ${KNOWLEDGE_LLM_BASE_URL:-}
      KNOWLEDGE_LLM_MODEL: ${KNOWLEDGE_LLM_MODEL:-}
      KNOWLEDGE_LLM_API_KEY: ${KNOWLEDGE_LLM_API_KEY:-}
    volumes:
      - radio-data:/data
      - ./web:/web:ro
      - ./icecast/icecast.xml:/host-icecast/icecast.xml
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - icecast
    restart: unless-stopped

  liquidsoap:
    build: ./liquidsoap
    environment:
      DATA_DIR: /data
      SUPERVISOR_POLL_SEC: "3"
    volumes:
      - radio-data:/data
    depends_on:
      - backend
      - icecast
    restart: unless-stopped

volumes:
  radio-data:
