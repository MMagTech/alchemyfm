<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090b" media="(max-width: 640px)">
  <title>Alchemy FM</title>
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Alchemy FM">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=109">
  <link rel="stylesheet" href="/static/themes.css?v=2">
  <link rel="stylesheet" href="/static/home-desktop.css?v=15" media="(min-width: 641px)">
  <link rel="stylesheet" href="/static/home-mobile.css?v=9" media="(max-width: 640px)">
  <script src="/static/themes.js?v=14"></script>
</head>
<body>
  <header>
    <h1 class="site-wordmark">
      <a href="/" class="site-wordmark-link">
        <span class="site-wordmark-icon" aria-hidden="true">
          <svg viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <rect x="1.5" y="9" width="3" height="9" rx="1.2"/>
            <rect x="6.5" y="6" width="3" height="12" rx="1.2"/>
            <rect x="11.5" y="3" width="3" height="15" rx="1.2"/>
            <rect x="16.5" y="7" width="3" height="11" rx="1.2"/>
          </svg>
        </span>
        <span class="site-wordmark-text"><span class="site-wordmark-name">Alchemy</span><span class="site-wordmark-fm">FM</span></span>
      </a>
    </h1>
    <div class="header-end">
      <label class="header-theme">
        <span class="sr-only">Color theme</span>
        <select id="theme-select" class="theme-select" aria-label="Color theme"></select>
      </label>
    </div>
  </header>
  <main>
    <p class="subtitle">Curated stations on the air. Everyone tuned in hears the same track.</p>
    <div id="stations" class="station-grid">
      <p class="empty">Loading stations…</p>
    </div>
  </main>
  <script src="/static/app.js"></script>
  <script>
    const cardState = new Map();

    function ensureCard(s) {
      let card = document.querySelector(`[data-slug="${CSS.escape(s.slug)}"]`);
      if (card) return card;

      card = document.createElement('article');
      card.className = 'station-card';
      card.dataset.slug = s.slug;
      card.innerHTML = `
        <div class="station-card-art-wrap" data-img-class="station-card-art"
          data-placeholder='<div class="station-card-art station-card-art-placeholder">♪</div>'></div>
        <div class="station-card-body">
          <div class="station-card-head">
            <h2></h2>
          </div>
          <div class="station-card-actions">
            <span class="station-card-listeners" title="Live listeners"></span>
            <a class="btn station-card-tune-in" href="#">Open</a>
          </div>
        </div>
        <div class="station-card-now">
          <span class="now-label">On Air</span>
          <span class="now-track"></span>
        </div>`;
      return card;
    }

    function syncTrackMarquee(trackEl) {
      const inner = trackEl.querySelector('.now-track-inner');
      if (!inner) return;
      trackEl.classList.remove('is-scrolling');
      trackEl.style.removeProperty('--scroll-distance');
      trackEl.style.removeProperty('--scroll-duration');
      requestAnimationFrame(() => {
        inner.style.display = 'inline-block';
        const cs = getComputedStyle(trackEl);
        const rootSize = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
        const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
        const fadePad = 1.1 * rootSize;
        const available = trackEl.clientWidth - padX;
        const overflow = inner.scrollWidth - available + fadePad;
        inner.style.removeProperty('display');
        if (overflow > 4) {
          trackEl.classList.add('is-scrolling');
          trackEl.style.setProperty('--scroll-distance', `-${overflow}px`);
          trackEl.style.setProperty('--scroll-duration', `${Math.max(16, overflow / 11)}s`);
        }
      });
    }

    function setNowPlayingTrack(trackEl, np) {
      let inner = trackEl.querySelector('.now-track-inner');
      if (!inner) {
        trackEl.innerHTML = `<span class="now-track-inner"></span>`;
        inner = trackEl.querySelector('.now-track-inner');
      }

      if (!np) {
        trackEl.classList.add('is-waiting');
        inner.textContent = 'Starting up…';
        trackEl.title = 'Starting up…';
        syncTrackMarquee(trackEl);
        return;
      }

      trackEl.classList.remove('is-waiting');
      const label = `${np.artist} — ${np.title}`;
      inner.innerHTML = `
        <span class="now-track-artist">${RadioApp.escape(np.artist)}</span><span class="now-track-sep" aria-hidden="true"> — </span><span class="now-track-title">${RadioApp.escape(np.title)}</span>`;
      trackEl.title = label;
      syncTrackMarquee(trackEl);
    }

    function updateCard(s) {
      const card = ensureCard(s);
      const np = s.now_playing;
      const trackKey = RadioApp.trackKey(np);
      const coverUrl = (np && np.cover_url) ? np.cover_url : (s.artwork_url || '');

      card.querySelector('h2').textContent = s.name;
      const listenersEl = card.querySelector('.station-card-listeners');
      const count = Number(s.listeners) || 0;
      listenersEl.textContent = count === 1 ? '1 Listening' : `${count} Listening`;
      listenersEl.classList.toggle('is-live', count > 0);
      listenersEl.setAttribute('aria-label', `${count} live listeners`);
      const trackEl = card.querySelector('.now-track');
      if (trackEl.dataset.trackKey !== trackKey) {
        trackEl.dataset.trackKey = trackKey || '';
        setNowPlayingTrack(trackEl, np);
        trackEl.classList.add('track-switch');
        requestAnimationFrame(() => trackEl.classList.remove('track-switch'));
      } else {
        setNowPlayingTrack(trackEl, np);
      }
      card.querySelector('.station-card-tune-in').href = `/station.html?slug=${encodeURIComponent(s.slug)}`;
      card.querySelector('.station-card-tune-in').textContent = 'Open';

      const artWrap = card.querySelector('.station-card-art-wrap');
      if (!coverUrl) {
        artWrap.dataset.trackKey = '';
        artWrap.innerHTML = artWrap.dataset.placeholder;
      } else {
        RadioApp.setCoverImage(artWrap, coverUrl, trackKey);
      }
      return card;
    }

    async function loadStations() {
      const root = document.getElementById('stations');
      try {
        const stations = await RadioApp.fetchJSON('/api/stations');
        if (!stations.length) {
          root.innerHTML = '<p class="empty">No stations on air yet.</p>';
          cardState.clear();
          return;
        }
        const seen = new Set();
        root.querySelector('.empty')?.remove();
        const frag = document.createDocumentFragment();
        stations.forEach(s => {
          seen.add(s.slug);
          frag.appendChild(updateCard(s));
        });
        root.querySelectorAll('[data-slug]').forEach(el => {
          if (!seen.has(el.dataset.slug)) el.remove();
        });
        root.appendChild(frag);
      } catch (err) {
        root.innerHTML = `<p class="empty">Could not load stations: ${RadioApp.escape(err.message)}</p>`;
      }
    }

    loadStations();
    setInterval(loadStations, 8000);
    window.addEventListener('resize', () => {
      document.querySelectorAll('.now-track').forEach(syncTrackMarquee);
    });
  </script>
</body>
</html>
