<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <title>Sign In — Alchemy FM</title>
  <link rel="icon" href="/static/icons/favicon.ico?v=2" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=148">
  <link rel="stylesheet" href="/static/themes.css?v=3">
  <script src="/static/themes.js?v=15"></script>
  <style>
    /* Keep login usable even if shared CSS fails or conflicts */
    body.login-page .login-shell {
      max-width: 420px;
      width: 100%;
      padding: 0;
      margin: 0;
    }

    .login-field input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 2;
      pointer-events: auto;
      -webkit-user-select: text;
      user-select: text;
    }

    .login-card {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body class="login-page">
  <div class="login-shell">
    <section class="login-card">
      <div class="login-brand">
        <div class="login-mark" aria-hidden="true">
          <i></i><span>Alchemy<em>FM</em></span>
        </div>
        <p class="login-eyebrow">Operator</p>
        <h1>Admin Sign In</h1>
        <p class="login-lede">Manage stations, queues, and broadcast settings.</p>
      </div>
      <div id="login-message" class="message" hidden></div>
      <form id="login-form" class="login-form" method="post" action="/api/admin/login" autocomplete="on">
        <div class="login-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        </div>
        <div class="login-field">
          <label for="password">Password</label>
          <div class="login-password-wrap">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="login-peek" id="password-peek" aria-label="Show password">Show</button>
          </div>
        </div>
        <button class="btn login-submit" type="submit">Sign In</button>
      </form>
      <p class="login-foot">
        <a href="/">← Back to stations</a>
      </p>
    </section>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const next = params.get('next') || '/';
    const usernameInput = document.getElementById('username');

    function showMessage(text, type) {
      const el = document.getElementById('login-message');
      el.hidden = false;
      el.className = `message ${type}`;
      el.textContent = text;
    }

    document.getElementById('password-peek').addEventListener('click', () => {
      const input = document.getElementById('password');
      const btn = document.getElementById('password-peek');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.textContent = show ? 'Hide' : 'Show';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });

    // Focus after paint — autofocus is unreliable in private browsing.
    window.requestAnimationFrame(() => {
      try {
        usernameInput.focus({ preventScroll: true });
      } catch (_) {
        usernameInput.focus();
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const submit = e.target.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: fd.get('username'),
            password: fd.get('password'),
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const detail = data.detail;
          const msg = typeof detail === 'string'
            ? detail
            : Array.isArray(detail)
              ? detail.map((d) => d.msg || String(d)).join(', ')
              : res.statusText;
          throw new Error(msg || 'Sign in failed');
        }
        location.replace(next);
      } catch (err) {
        showMessage(err.message || 'Sign in failed', 'error');
        submit.disabled = false;
        submit.textContent = 'Sign In';
        usernameInput.focus();
      }
    });
  </script>
</body>
</html>
