name: Test

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install plugin test dependencies
        run: pip install -r audiomuse-plugins/alchemy_fm_bridge/tests/requirements.txt

      - name: Syntax check plugin
        run: python3 -m py_compile audiomuse-plugins/alchemy_fm_bridge/__init__.py

      - name: Run plugin tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
        run: pytest audiomuse-plugins/alchemy_fm_bridge/tests -v --tb=short

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          DATA_DIR: /tmp/alchemyfm-test
          ADMIN_PASSWORD: test-admin
          KNOWLEDGE_FEATURE: "false"
          ICECAST_DOCKER_RESTART: "false"
        run: pytest backend/tests -v --tb=short

  release-plugin:
    name: Release plugin catalog
    runs-on: ubuntu-latest
    needs: [plugin-tests, backend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build zip and update plugin catalog
        run: |
          python scripts/release_plugin.py "CI release: deploy bootstrap fix, deploy route tests, and automated plugin packaging."

      - name: Commit plugin release artifacts
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audiomuse-plugins/alchemy_fm_bridge.zip \
            audiomuse-plugins/alchemy_fm_bridge/plugin.json \
            audiomuse-plugins/alchemy_fm_bridge/__init__.py
          if git diff --cached --quiet; then
            echo "Plugin catalog already up to date."
            exit 0
          fi
          VERSION="$(python -c "import re, pathlib; text=pathlib.Path('audiomuse-plugins/alchemy_fm_bridge/__init__.py').read_text(); print(re.search(r'PLUGIN_VERSION = \"([^\"]+)\"', text).group(1))")"
          git commit -m "Release Channel Designer plugin ${VERSION}."
          if [ -n "${RELEASE_BOT_TOKEN}" ]; then
            git push "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:master
          else
            git push || {
              echo "::warning::Could not push plugin release commit — add a RELEASE_BOT_TOKEN secret with bypass permission for protected master, or commit the release artifacts manually."
              exit 0
            }
          fi
