name: Publish Docker images

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    # master publishes :latest (stable); every other branch here publishes
    # :test (beta). Add another branch to this list to have it publish :test too.
    # Note :test is shared by every non-master branch, so when more than one is
    # listed, pin compose to the :<sha> tag to be sure which build you are on.
    branches: [master, knowledge, ui-rebuild]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.result.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Decide whether to publish Docker images
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "docker=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(backend/|liquidsoap/|icecast/|web/|docker-compose|.*Dockerfile|\.github/workflows/docker-publish\.yml)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: .
            file: backend/Dockerfile
            image: backend
          - context: ./liquidsoap
            file: liquidsoap/Dockerfile
            image: liquidsoap
          - context: ./icecast
            file: icecast/Dockerfile
            image: icecast
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On workflow_run, github.ref is the DEFAULT branch, not the branch that
      # triggered the run -- so {{is_default_branch}} would be true for beta
      # builds and tag them :latest. Resolve the real source branch instead.
      - name: Resolve source branch
        id: src
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/mmagtech/alchemyfm-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ steps.src.outputs.branch == 'master' }}
            type=raw,value=test,enable=${{ github.event_name != 'push' && steps.src.outputs.branch != 'master' }}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
